<div class="constr-grid" id="service">
  @for (similar of  content()!.results | slice:0:6;track similar.id){
    <div class="constr-card" (click)="goToDetailsView(similar.id)" >
      <div class="constr-blob constr-blob-1"></div>
      <div class="constr-content" >
        <p-image  src="https://image.tmdb.org/t/p/w300{{similar.poster_path}}" alt=".." width="250"/>

        <p>{{similar.vote_average | number :'1.1-1'}}</p>
      </div>
    </div>
  }
</div>
