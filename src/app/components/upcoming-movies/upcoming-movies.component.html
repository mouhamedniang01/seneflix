<div class="container-mg container">

  <h2 class="title">tendance</h2>
    @if (movies$ | async ; as movies){
      <div class="slick-wrapper">
        <ngx-slick-carousel
          class="carousel" #slickModal="slick-carousel" 
          [config]="slideConfig"
        >
      @for (movie of movies.results ; track movie.poster_path){     
       <div   ngxSlickItem  (dblclick)="goToDetailPage(movie.id)" >
          <img [title]="movie.original_title"
          src="https://image.tmdb.org/t/p/w300{{movie.poster_path}}" alt="" width="250" />
         
       </div>
      }
      </ngx-slick-carousel>
    </div>
}  

</div>
