<p-menubar [model]="items()" class="mb-2 nav">
  <ng-template #start>
    <h3 #title class="prime" [routerLink]="'/home'" >Prime </h3>
    <h3 class="ml-2" routerLink="/home">Wideo</h3>

    <svg width="33" height="35" viewBox="0 0 33 35" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path  fill="var(--primary-color)"  d=""/>
    </svg>

  </ng-template>
  <ng-template #end aria-label="search & lang">
    <div class="flex items-center gap-2">
      <app-autocomplete
        (selected)="onSelectMovie($event)"
        (search)="handleSearch($event)"
        [value]="keyword()"
        (cleared)="clearSearchInput()"
        [suggestions]="resultSearchMovies()!"
        [delay]="300" 
      />
      <app-language-selector
        (onLanguageUpdate)="handleLanguageUpdate($event)"
      ></app-language-selector>
    </div>
  </ng-template>
</p-menubar>
