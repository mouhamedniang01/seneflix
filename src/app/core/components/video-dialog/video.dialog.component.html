@if (video(); as video){
  <p-dialog [visible]="visible()"
            (onHide)="onClose()"
            (visibleChange)="onClose()"
            [modal]="true"
            [style]="{ width: '50rem',height:'40rem' }"
            [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
            [draggable]="false" [resizable]="true"
            (keyup.escape)="onClose()" (keydown.escape)="onClose()" (keydown.enter)="onClose()"
  >
    <ng-template #header>
      <div [class]="video.results[0]?'inline-flex items-center justify-center gap-8':'hidden'">
        <span [class]="
        video.results[0]?'font-bold whitespace-nowrap':'hidden'"
        >{{video.results[0]?.name}}</span>

      </div>
    </ng-template>
    <div class="flex items-center is-center">
      @if (video.results[0]?.key != undefined){
        <figure>
          <youtube-player
            videoId="{{video.results[0]?.key}}"
            [width]="750"  [title]="title()"
          />
        </figure>

      }
    </div>
    <h2 [class]="video.results[0].key?'hidden':'flex'">
      <i class="pi pi-comments" style="width: 4.5rem;"></i>
      No video found</h2>
    <ng-template #footer>
      <p-button label="Cancel" icon="pi pi-times-circle"  severity="danger" (click)="onClose()" />
    </ng-template>
  </p-dialog>
} @else {
  <h1 class="text-blue-800">
    <i class="pi pi-compass" style="width: 2.5rem;color: #0f172a;"></i>
    No trailer were found
  </h1>
}
