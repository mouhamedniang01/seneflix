
    <!-- credits actors  casting card here-->
      <div class="casting is-centered">
        @for (actor of credits()!.cast; track actor.id) {
          <!-- card credit -->
           <div class="credit-card">
                 <!--show actor image if exist -->
             @if (actor?.profile_path){
              <p-image   width="250" height="250" class="rounded-border mb-3"
              [alt]="actor?.name"
              src="https://image.tmdb.org/t/p/w440_and_h660_face{{actor?.profile_path}}" />
            }@else {
           <p-image alt=""  src="https://placehold.co/600x600" width="250" height="250"
               class=" rounded-border mb-3" />
            }<br>
          <b > {{ actor.original_name }} </b>
          <p class="role">Rôle:  {{ actor.character }}</p>
           </div>



            }
         <!--credit card -->
     </div> <!-- end of credit card -->
