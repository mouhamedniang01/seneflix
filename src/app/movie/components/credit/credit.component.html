<div class="card flex justify-center">
  <p-button (onClick)="toggle($event)" icon="pi pi-eye"
            [label]="selectedActor ? selectedActor.name :'Show casts'" />
  <p-popover #op>
    <div class="flex flex-col gap-4 w-100">
      <div>
        <span class="font-medium text-surface-900 dark:text-surface-0 block mb-2">Castings</span>
        <p-inputgroup>
          <input pInputText placeholder="Search ..." class="w-100" />
          <p-inputgroup-addon>
            <i class="pi pi-copy"></i>
          </p-inputgroup-addon>
        </p-inputgroup>
      </div>
      <div>
        <span class="font-medium text-surface-900 dark:text-surface-0 block mb-2">More</span>
        <div class="flex">
          <p-inputgroup>
            <input pInputText disabled />
            <button pButton label="Invite" icon="pi pi-users"></button>
          </p-inputgroup>
        </div>
      </div>
      <div>
        <span class="font-medium text-surface-900 dark:text-surface-0 block mb-2">Castings</span>
        <ul class="list-none p-0 m-0 flex flex-col gap-4">
          @for (member of actors(); track member) {
            <li class="flex items-center gap-2 " (click)="selectActor(member)">
              <img src="https://image.tmdb.org/t/p/w440_and_h660_face{{member.profile_path}}" style="width: 32px"  alt="" />
              <div>
                <span class="font-medium">{{ member.name }}</span>
              </div>
              <div class="flex items-center gap-2 text-muted-color ml-auto text-sm">
                <span>Cast as : {{ member.character}}</span>
                <i class="pi pi-angle-down">{{member.id}}</i>
              </div>
            </li>
          }
        </ul>
      </div>
    </div>
  </p-popover>
</div>
