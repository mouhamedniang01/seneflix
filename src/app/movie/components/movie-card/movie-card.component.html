<div class="movie-card"
     [style.background-repeat]="'no-repeat'"
     [style.background-size]="'cover'"
     [style.background]="'url(https://image.tmdb.org/t/p/w780'+poster_path()+')'">

    @if(name();as name){
     <h1>{{name}}</h1>
    }

  @if (popularity();as popularity) {
    <span>Popularity : {{popularity | number:'1.0-1'}} <i class="pi pi-chart-line"></i></span>
  }

  @if (rating();as rating) {
      <span>{{rating | number : '1.0-1'}} <i class="pi pi-star-fill"></i></span>
  }

  @if (synopsis();as synopsis) {
  <p class="synopsis mt-1">{{synopsis}}</p>
  }

  @if (movieId();as movieId) {
    <button class="watch" (click)="goToDetailPage(movieId)">SHOW MOVIE</button>
  }

</div>
