@defer {
  <!-- filter for genre's movie type-->
  <div  class="flex justify-center  pt-3 gap-3">
    <app-genre-autocomplete
      [language]="langueSignal()"
      (onSelectedGenre)="handleGenreChange($event)"
      [type]="type()"/>
    <!-- movies type Popular || Upcoming -->
    <p-selectbutton class="ml-5"
                    severity="secondary"
                    [options]="moviesOptions"
                    [(ngModel)]="selectedMovieType"
                    optionLabel="label"
                    optionValue="value"
                    aria-labelledby="basic">
    </p-selectbutton>
  </div>

  @if (selectedMovieType === MovieTypeEnum.POPULAR){
    @if (populars();as  popular){
      <app-movie-list aria-label=" Popular Movies"
                      [moviesInputSignal]="popular"
                      (onPageUpdate)="handlePageChange($event)"
                      [totalResults]="popularTotalResults()"
      ></app-movie-list>
    }
  } @else {
    @if (upcomingMovies();as  movies){
      <app-movie-list aria-label="Upcoming Movies"
                      [moviesInputSignal]="movies"
                      (onPageUpdate)="handlePageChange($event)"
                      [totalResults]="upcomingTotalResults()"></app-movie-list>
    }
  }

} @loading (minimum 100ms; after  1s){
  <app-loading-spinner/>
}
