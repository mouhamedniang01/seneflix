
@defer (hydrate on viewport){
  <div  class="flex justify-center  pt-3 gap-3">
    <app-genre-autocomplete
      [language]="languageSignal()" 
      (onSelectedGenre)="handleGenreChange($event)"
      [type]="type()"/>
  </div>
  @if (trendingMovies();as trendings) {
    @for (movie of trendings;track  movie.id){
      <app-movie-card
        [name]="movie.title"
        [poster_path]="movie.backdrop_path"
        [movieId]="movie.id"
        [synopsis]="movie.overview"
        [popularity]="movie.popularity"
        [rating]="movie.vote_average"
        [realese_date]="movie.release_date"

      ></app-movie-card>
    }
    <!--paginator -->
    <p-paginator
      (onPageChange)="onPageChange($event)"
      [first]="first()"
      [rows]="rows()"
      [totalRecords]="total_results()"  />
  }

} @loading (minimum 1s;after 100ms){
  <app-loading-spinner/>
}
