<p-autoComplete
  [(ngModel)]="value"
  [suggestions]="suggestions()"
  [translate]="isTranslate()"
  [name]="name()"
  [placeholder]="placeholder()"
  [multiple]="multiple()"
  [dropdown]="dropdown()"
  [delay]="delay()"
  [disabled]="disabled()"
  (completeMethod)="onSearch($event)"
  (onSelect)="onSelect($event)"
  (onClear)="onClear()"
  [showClear]="true"
  [fluid]="isFluid()"
/>
