<p-dialog [header]="header()" [modal]="true"
          [visible]="isModalVisible()"
          (onShow)="showDialog()"
          (visibleChange)="onHideModal()"
          (change)="showDialog()"
          [style.width]="width()"
          [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
          [maximizable]="maximizable"
          (onHide)="onHideModal()">
  <div class="flex">
    <div class="w-64 flex-auto">
      @if (headerSubtitle()){
        {{headerSubtitle()}}
      }
      @if (birthday()){
       <h3 [style.display]="birthday()?'flex':'none'">Born in:  {{'\t'+birthday() | date :'dd-MM-yyyy'}}</h3>
      }
      <div class="flex-none mb-2 md:flex-1">
        @if (content()){
          {{content()}}
        }
        <br/>
        <button pButton
          severity="contrast"
          [style.display]="
          textButton() ?'display':'none'"
          (click)="nagivateToPage()"  >{{textButton()}}</button>
      </div>
    </div>

    <div class="w-32 flex-auto ">
      @if (avatar()) {
        <p-image src="{{avatar()}}" [title]="header()"   width="300" height="300"></p-image>
      }
    </div>

  </div>
</p-dialog>
