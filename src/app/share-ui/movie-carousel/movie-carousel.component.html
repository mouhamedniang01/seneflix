@if (movies$ | async; as movies) {
    <p-carousel [value]="movies.results" [numVisible]="1" [numScroll]="1"
     [autoplayInterval]="autoplayInterval"
    [responsiveOptions]="responsiveOptions()" >
        <ng-template let-movie #item>
          <div class="border border-surface-200 dark:border-surface-700 rounded m-3 p-5">
                <div class="mb-3">
                    <div class="relative mx-auto m-5" (click)="navigateToDetailsPage(movie.id)">
                      <img  alt=".."
                      [title]="movie.title"
                      src="https://image.tmdb.org/t/p/original{{movie.backdrop_path}}"
                       class="w-full rounded-border" />
                    </div>
                </div>
            </div>
        </ng-template>
    </p-carousel>


}
