@if (movies()){
    <p-carousel [value]="movies()!.results" [numVisible]="visibleAndScrollNumber()"
                [numScroll]="visibleAndScrollNumber()"
     [autoplayInterval]="autoplayInterval" [showNavigators]="showNavigation()"
                [showIndicators]="showIndicators()"
    [responsiveOptions]="responsiveOptions()" >
        <ng-template let-movie #item>
          <div class="is-centered border border-surface-200 dark:border-surface-700 rounded m-3 p-5 ">
                <div class="mb-3">
                    <div class="relative mx-auto " (click)="navigateToDetailsPage(movie.id)">
                      <figure>
                        <img  alt=".."
                              [title]="movie.title"
                              [src]="showPosterPath()?
                      'https://image.tmdb.org/t/p/original'+movie.poster_path:
                      'https://image.tmdb.org/t/p/original'+movie.backdrop_path"
                              class="w-full rounded-border  " />
                      </figure>

                    </div>
                </div>
            </div>
        </ng-template>
    </p-carousel>


}
